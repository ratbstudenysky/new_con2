<script>
const $ = id => document.getElementById(id);
let t, i = 0;

function startCat() {
  clearInterval(t);
  const cat = $('cat');
  if (cat) {
    t = setInterval(() => {
      cat.style.backgroundPositionX = (i++ % 10) * (100 / 9) + '%';
    }, 100);
  }
}

function requestFullscreen() {
  const elem = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.mozRequestFullScreen) {
      elem.mozRequestFullScreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
  }
}

// หมุนแมวทันทีเมื่อเข้าหน้าเว็บ
startCat();

// พยายามเข้าสู่ Fullscreen ทันทีและเมื่อมีการแตะ/คลิกหน้าจอ (รองรับทุกเบราว์เซอร์และทุกอุปกรณ์)
window.addEventListener('DOMContentLoaded', () => {
  requestFullscreen();
});
['click', 'touchstart', 'pointerdown', 'keydown'].forEach(evt => {
  document.addEventListener(evt, requestFullscreen, { passive: true });
});
</script></body></html>
